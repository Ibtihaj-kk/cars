<span id="cart-badge" class="badge bg-danger rounded-pill position-absolute top-0 start-100 translate-middle" style="font-size: 0.6rem; padding: 0.3em 0.6em;" hx-swap-oob="true">
    {{ cart_count }}
</span>

<div id="messages-container" hx-swap-oob="beforeend">
    <div class="toast show align-items-center text-white bg-success border-0 auto-hide-toast" role="alert" aria-live="assertive" aria-atomic="true">
        <div class="d-flex">
            <div class="toast-body">
                {{ message }}
            </div>
            <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close" onclick="closeMessage(this)"></button>
        </div>
    </div>
    <script>
        // Auto-hide this specific toast after 5 seconds
        setTimeout(function() {
            const toast = document.querySelector('.auto-hide-toast:last-child');
            if (toast) {
                toast.classList.remove('show');
                setTimeout(function() {
                    toast.remove();
                }, 300);
            }
        }, 5000);
    </script>
</div>
