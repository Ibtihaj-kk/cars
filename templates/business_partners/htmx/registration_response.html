{% if success %}
    <div class="bg-green-50 border border-green-200 rounded-lg p-4 mb-4">
        <div class="flex items-center">
            <svg class="w-5 h-5 text-green-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
            </svg>
            <div>
                <h3 class="text-green-800 font-medium">Registration Successful!</h3>
                <p class="text-green-700 text-sm mt-1">{{ message }}</p>
            </div>
        </div>
    </div>
    
    {% if redirect_url %}
    <script>
        // Redirect after successful registration
        setTimeout(function() {
            window.location.href = '{{ redirect_url }}';
        }, 2000);
    </script>
    {% endif %}
{% else %}
    <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-4">
        <div class="flex items-center mb-2">
            <svg class="w-5 h-5 text-red-500 mr-2" fill="currentColor" viewBox="0 0 20 20">
                <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
            </svg>
            <p class="text-red-800 font-medium">Registration Failed</p>
        </div>
        <p class="text-red-700 text-sm">{{ message }}</p>
        
        {% if errors %}
        <ul class="text-red-600 text-sm mt-2 space-y-1">
            {% for field, error in errors.items %}
                <li>• {{ error }}</li>
            {% endfor %}
        </ul>
        {% endif %}
    </div>
{% endif %}
