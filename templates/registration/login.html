{% load static %} <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CarSyncro - Sign In</title>
    <link rel="icon" type="image/png" href="{% static 'images/favicon-cs.png' %}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
        
        .divider {
            height: 1px;
            background: linear-gradient(to right, transparent, #e5e7eb, transparent);
        }
        
        .password-toggle {
            cursor: pointer;
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            color: #6b7280;
        }
        
        .password-toggle:hover {
            color: #374151;
        }
        nav {
            box-shadow: 0 4px 20px rgba(0,0,0,0.05);
            background: white;
            position: relative;
            z-index: 50;
            padding:15px;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
    <div class="flex flex-col md:flex-row h-screen">
        <div class="w-full md:w-1/2 flex items-center justify-center p-8 md:p-16 relative">
            <div class="absolute top-6 left-6">
                <div class="text-white px-4 py-2"><a href="{% url 'home' %}">
                    <img src="{% static 'images/car-syncro.png' %}" alt="CarSyncro" class="h-12 w-auto object-contain"></a>
                </div>
            </div>
            
            <div class="w-full max-w-md mt-32">
                <h2 class="text-4xl font-semibold text-gray-800 mb-8 mt-8">Sign In</h2>
                
                <!-- Vendor HTMX Login Form -->
                {% include 'business_partners/htmx/vendor_login_form.html' %}
                
                <!-- Traditional Login Form (Hidden) -->
                <div id="traditional-login" class="hidden">
                    <!-- Traditional login form hidden completely -->
                </div>


                
                <div class="text-center mt-4">
                    <a href="#" class="text-black-600 hover:text-gray-800 text-sm font-medium transition-colors">
                        Trouble Signing In?
                    </a>
                </div>
                
                <div class="flex items-center my-6">
                    <div class="flex-grow border-t border-gray-300"></div>
                    <span class="flex-shrink mx-4 text-gray-500 text-sm">Or</span>
                    <div class="flex-grow border-t border-gray-300"></div>
                </div>
                
                <div class="text-center">
                    <a href="#" onclick="openModal(); return false;" class="text-black-600 hover:text-gray-800 font-medium transition-colors">
                        Create Account
                    </a>
                </div>
                
            </div>
        </div>
        
        <div class="w-full md:w-1/2 bg-white flex items-center justify-center">
            <div class="max-w-xlg w-full flex justify-center">
                <img 
                    src="https://purepng.com/public/uploads/large/51506279449pjpwvzyktfinnxu47jlnkhs1im0iucnp24uzehqzuspy9bzygj9fsm4awlglniknr8zviza8wjphqjzkjacvt17jcg0auyjvkexw.png" alt="Luxury Car" >
            </div>
        </div>
    </div>
    
    <!-- Registration Selection Modal -->
    <div id="signupModal"
        class="fixed inset-0 bg-black bg-opacity-60 hidden items-center justify-center z-[100] backdrop-blur-sm transition-opacity duration-300">
        <div
            class="bg-white rounded-3xl p-10 max-w-md w-full mx-4 shadow-2xl relative border border-gray-100 transform transition-all scale-100">

            <button onclick="closeModal()"
                class="absolute top-5 right-5 p-2 rounded-full hover:bg-gray-100 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-gray-500" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12" />
                </svg>
            </button>

            <div class="text-center mb-8">
                <h2 class="text-3xl font-extrabold text-gray-900 mb-3 tracking-tight">Join CarSyncro</h2>
                <p class="text-gray-500">Select your account type to continue</p>
            </div>

            <div class="space-y-4">
                <a href="{% url 'users:register_page' %}"
                    class="group block w-full py-5 px-6 border-2 border-black rounded-2xl hover:bg-black hover:text-white transition-all duration-300 flex items-center justify-between">
                    <div class="flex items-center gap-4">
                        <span class="p-2 bg-gray-100 rounded-lg group-hover:bg-gray-800 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" />
                            </svg>
                        </span>
                        <span class="font-bold text-lg">Individual</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 transform group-hover:translate-x-1 transition-transform" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>

                <a href="{% url 'business_partners:registration' %}"
                    class="group block w-full py-5 px-6 bg-black text-white border-2 border-black rounded-2xl hover:bg-white hover:text-black transition-all duration-300 flex items-center justify-between shadow-lg hover:shadow-xl">
                    <div class="flex items-center gap-4">
                        <span class="p-2 bg-gray-800 rounded-lg group-hover:bg-gray-100 transition-colors">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24"
                                stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                    d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
                            </svg>
                        </span>
                        <span class="font-bold text-lg">Business</span>
                    </div>
                    <svg xmlns="http://www.w3.org/2000/svg"
                        class="h-5 w-5 transform group-hover:translate-x-1 transition-transform" fill="none"
                        viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <script>
        function openModal() {
            const modal = document.getElementById('signupModal');
            modal.classList.remove('hidden');
            modal.classList.add('flex');
            // Prevent body scroll when modal is open
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('signupModal');
            modal.classList.add('hidden');
            modal.classList.remove('flex');
            // Restore body scroll
            document.body.style.overflow = 'auto';
        }

        // Close modal if clicking outside the content box
        window.onclick = function (event) {
            const modal = document.getElementById('signupModal');
            if (event.target == modal) {
                closeModal();
            }
        }

        // Password show/hide functionality for traditional form (if elements exist)
        document.addEventListener('DOMContentLoaded', function() {
            const togglePassword = document.getElementById('togglePassword');
            const password = document.getElementById('password');
            
            if (togglePassword && password) {
                const eyeIcon = togglePassword.querySelector('i');
                
                togglePassword.addEventListener('click', function() {
                    // Toggle the type attribute
                    const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
                    password.setAttribute('type', type);
                    
                    // Toggle the eye icon
                    if (type === 'password') {
                        eyeIcon.classList.remove('fa-eye-slash');
                        eyeIcon.classList.add('fa-eye');
                    } else {
                        eyeIcon.classList.remove('fa-eye');
                        eyeIcon.classList.add('fa-eye-slash');
                    }
                });
            }
        });
    </script>
</body>
</html>
