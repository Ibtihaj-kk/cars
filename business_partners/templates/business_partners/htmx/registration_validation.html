{% if field and not is_valid %}
  <div class="validation-error absolute right-3 top-1/2 transform -translate-y-1/2">
    <svg class="w-5 h-5 text-red-500" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zm-7 4a1 1 0 11-2 0 1 1 0 012 0zm-1-9a1 1 0 00-1 1v4a1 1 0 102 0V6a1 1 0 00-1-1z" clip-rule="evenodd"></path>
    </svg>
  </div>
  <div class="validation-message absolute right-10 top-1/2 transform -translate-y-1/2 bg-red-500 text-white text-xs px-2 py-1 rounded shadow-lg whitespace-nowrap z-10 hidden">
    {% for error in errors.values %}{{ error }}{% if not forloop.last %}; {% endif %}{% endfor %}
  </div>
  <style>
    .validation-error:hover + .validation-message,
    .validation-message:hover {
      display: block !important;
    }
  </style>
{% elif field and is_valid %}
  <div class="validation-success absolute right-3 top-1/2 transform -translate-y-1/2">
    <svg class="w-5 h-5 text-green-500" fill="currentColor" viewBox="0 0 20 20">
      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm3.707-9.293a1 1 0 00-1.414-1.414L9 10.586 7.707 9.293a1 1 0 00-1.414 1.414l2 2a1 1 0 001.414 0l4-4z" clip-rule="evenodd"></path>
    </svg>
  </div>
{% endif %}
