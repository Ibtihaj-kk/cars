<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Message Functionality</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .toast-container { position: fixed; top: 20px; right: 20px; z-index: 1050; }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2>Test Message Functionality</h2>
        <button id="addMessageBtn" class="btn btn-primary">Add Test Message</button>
        <button id="clearAllBtn" class="btn btn-secondary">Clear All Messages</button>
    </div>

    <!-- Message Container -->
    <div id="messages-container" class="toast-container p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Test the message functionality
        document.addEventListener('DOMContentLoaded', function() {
            const messagesContainer = document.getElementById('messages-container');
            const addBtn = document.getElementById('addMessageBtn');
            const clearBtn = document.getElementById('clearAllBtn');

            // Function to add a test message
            function addTestMessage() {
                const messageDiv = document.createElement('div');
                messageDiv.className = 'toast show align-items-center text-white bg-success border-0 auto-hide-toast';
                messageDiv.innerHTML = `
                    <div class="d-flex">
                        <div class="toast-body">
                            Test message added at ${new Date().toLocaleTimeString()}
                        </div>
                        <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast" aria-label="Close" onclick="closeMessage(this)"></button>
                    </div>
                `;
                messagesContainer.appendChild(messageDiv);
                
                // Trigger auto-hide setup
                setupAutoHide();
            }

            // Function to clear all messages
            function clearAllMessages() {
                messagesContainer.innerHTML = '';
            }

            // Function to handle auto-hide for messages
            function setupAutoHide() {
                const messages = document.querySelectorAll('#messages-container .toast');
                messages.forEach(function(toast) {
                    // Skip if already has auto-hide setup
                    if (toast.dataset.autoHideSetup) return;
                    
                    // Mark as setup
                    toast.dataset.autoHideSetup = 'true';
                    
                    // Auto-hide after 5 seconds
                    setTimeout(function() {
                        toast.classList.remove('show');
                        setTimeout(function() {
                            toast.remove();
                        }, 300);
                    }, 5000);
                });
            }

            // Global function to close messages (for onclick handlers)
            window.closeMessage = function(button) {
                const toast = button.closest('.toast');
                if (toast) {
                    toast.classList.remove('show');
                    setTimeout(function() {
                        toast.remove();
                    }, 300);
                }
            };

            // Monitor for new messages added
            const observer = new MutationObserver(function(mutations) {
                mutations.forEach(function(mutation) {
                    if (mutation.type === 'childList' && mutation.addedNodes.length > 0) {
                        setupAutoHide();
                    }
                });
            });

            if (messagesContainer) {
                observer.observe(messagesContainer, { childList: true });
            }

            // Add event listeners
            addBtn.addEventListener('click', addTestMessage);
            clearBtn.addEventListener('click', clearAllMessages);

            // Add initial message
            addTestMessage();
        });
    </script>
</body>
</html>
