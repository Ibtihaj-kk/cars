<!-- HTMX Cart Badge Fragment -->
<span id="cart-badge" class="cart-badge">
    <svg class="cart-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
        <path d="M9 2L7.5 6H20.5L19 2H9Z" stroke="currentColor" stroke-width="2"/>
        <path d="M7.5 6L6 22H21L19.5 6H7.5Z" stroke="currentColor" stroke-width="2"/>
    </svg>
    <span class="cart-count">{{ cart_count }}</span>
</span>

{% if message %}
<div class="toast-notification"
     hx-swap-oob="beforeend:body">
    <div class="toast toast-success">
        {{ message }}
    </div>
</div>
{% endif %}
